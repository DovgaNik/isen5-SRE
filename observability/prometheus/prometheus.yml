global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'service-a-auth'
    static_configs:
      - targets: ['service-a:8081']

  - job_name: 'service-b-catalog'
    static_configs:
      - targets: ['service-b:8082']

  - job_name: 'service-c-order'
    static_configs:
      - targets: ['service-c:8083']

  - job_name: 'service-d-payment'
    static_configs:
      - targets: ['service-d:8084']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
